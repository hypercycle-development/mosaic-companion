name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            platform: linux-x64
            build_cmd: electron-builder --linux --x64
            arch: x64
          - os: ubuntu-latest
            platform: linux-arm64
            build_cmd: electron-builder --linux --arm64
            arch: arm64
          # macOS builds (both archs in one command to generate unified latest-mac.yml)
          - os: macos-latest
            platform: mac
            build_cmd: electron-builder --mac --x64 --arm64
            arch: x64
          # Windows builds
          - os: windows-latest
            platform: win-x64
            build_cmd: electron-builder --win --x64
            arch: x64
          - os: windows-latest
            platform: win-arm64
            build_cmd: electron-builder --win --arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      npm_config_arch: ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for arm64 (Windows)
        if: matrix.platform == 'win-arm64'
        run: npm rebuild --platform=win32 --arch=arm64

      - name: Build app
        run: npm run build

      - name: Build Electron (${{ matrix.platform }})
        run: npx ${{ matrix.build_cmd }}

      - name: Verify build artifacts exist
        shell: bash
        run: |
          echo "=== All release files ==="
          ls -la release/
          echo ""
          echo "=== YAML update files ==="
          ls -la release/*.yml 2>/dev/null || echo "No YAML files found"
          echo ""

          if [[ "${{ matrix.platform }}" == linux-* ]]; then
            ls release/*.AppImage && echo "✓ AppImage found"
          elif [ "${{ matrix.platform }}" == "mac" ]; then
            ls release/*.dmg && echo "✓ DMG found"
          elif [[ "${{ matrix.platform }}" == win-* ]]; then
            ls release/*.exe && echo "✓ EXE found"
          fi
