name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # Linux arm64 (cross-compile)
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # macOS x64
          - os: macos-latest
            platform: darwin
            arch: x64
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Windows x64
          - os: windows-latest
            platform: win32
            arch: x64
          # Windows arm64 (cross-compile)
          - os: windows-latest
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Linux-specific: Install build dependencies for deb maker
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Build Electron (${{ matrix.platform }}/${{ matrix.arch }})
        run: npm run make -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify build artifacts exist
        shell: bash
        run: |
          echo "=== Build output ==="
          find out/make -type f 2>/dev/null | head -20 || echo "No artifacts in out/make"
          echo ""

          if [ "${{ matrix.platform }}" == "linux" ]; then
            echo "=== Linux ${{ matrix.arch }} artifacts ==="
            ls out/make/deb/${{ matrix.arch }}/*.deb 2>/dev/null && echo "✓ DEB found" || echo "No DEB"
            ls out/make/zip/linux/${{ matrix.arch }}/*.zip 2>/dev/null && echo "✓ ZIP found" || echo "No ZIP"
          elif [ "${{ matrix.platform }}" == "darwin" ]; then
            echo "=== macOS ${{ matrix.arch }} artifacts ==="
            ls out/make/*.dmg 2>/dev/null && echo "✓ DMG found" || echo "No DMG"
            ls out/make/zip/darwin/${{ matrix.arch }}/*.zip 2>/dev/null && echo "✓ ZIP found" || echo "No ZIP"
          elif [ "${{ matrix.platform }}" == "win32" ]; then
            echo "=== Windows ${{ matrix.arch }} artifacts ==="
            ls out/make/squirrel.windows/${{ matrix.arch }}/*.exe 2>/dev/null && echo "✓ EXE found" || echo "No EXE"
          fi
