name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Fast, cheap build check — runs on all PRs and main pushes
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # Native arm64 — see the note in release.yml's matrix and #112.
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Node-side unit tests. Cheap, and they run before the ~minutes-long
      # packaging steps below so a broken vault fails the job in seconds.
      # x64 only: the suites are architecture-independent and running them
      # twice buys nothing.
      - name: Typecheck (x64 only)
        if: matrix.arch == 'x64'
        run: npm run typecheck

      - name: Vault persistence tests (x64 only)
        if: matrix.arch == 'x64'
        run: npm run test:vault

      - name: Vault crypto and atomic-write tests (x64 only)
        if: matrix.arch == 'x64'
        run: npm run test:vault-crypto

      # The withdrawal tests are the enforcement tests for a security
      # mechanism — an addon the publisher has withdrawn must stop running on
      # someone's machine. Until this step existed they ran nowhere in CI and
      # gated nothing.
      - name: Addon withdrawal tests (x64 only)
        if: matrix.arch == 'x64'
        run: npm run test:addons

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Write mock Gmail credentials (build check only)
        run: cp config/gmail-credentials.example.json config/gmail-credentials.json
        # shell: bash

      - name: Build Electron (${{ matrix.platform }}/${{ matrix.arch }})
        run: npm run make -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # v0.1.10 shipped an asar with no addon-preload.js, because the Forge
      # generateAssets hook ran a stale esbuild config that never emitted it.
      # Every addon broke, and nothing here caught it: the app still launched
      # (the preload fails silently) and the .deb still built. Assert the
      # payload directly — every file the main process resolves at runtime must
      # actually be inside the package.
      #
      # The two native modules are in that list for the same reason: on Linux
      # neither has a prebuild, so both must be compiled, and a cross-build
      # silently omitted node-pty's — the app then died at startup with no
      # window (#112). better-sqlite3 is the other one, and had the same
      # exposure without the same luck of being noticed.
      #
      # Both `build/Release/` paths are where a COMPILED module lands. This
      # matrix is Linux-only; a darwin or win32 leg would need the
      # `prebuilds/<platform>-<arch>/` path instead, since those load a
      # shipped prebuild rather than compiling.
      - name: Verify asar contains every runtime-resolved file
        shell: bash
        run: |
          APP_NAME=$(node -p "require('./package.json').name")
          ASAR="out/${APP_NAME}-linux-${{ matrix.arch }}/resources/app.asar"
          if [ ! -f "$ASAR" ]; then
            echo "✗ asar not found at $ASAR"
            exit 1
          fi
          # Listing goes to a file, not a pipe: this step's shell runs with
          # `-o pipefail`, and `grep -q` closes the pipe on its first match,
          # which SIGPIPEs the writer and makes the whole pipeline report
          # failure — every file then reads as missing.
          npx asar list "$ASAR" > asar-contents.txt
          MISSING=0
          for f in \
            dist/main/main.js \
            dist/main/preload.js \
            dist/main/addon-preload.js \
            dist/main/secure-wallet-import-preload.js \
            dist/main/mcp-server.js \
            dist/renderer/index.html \
            bundled-addons/hyperinsight/manifest.json \
            node_modules/node-pty/build/Release/pty.node \
            node_modules/better-sqlite3/build/Release/better_sqlite3.node
          do
            if grep -qxF "/$f" asar-contents.txt; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              MISSING=1
            fi
          done
          exit $MISSING

      # Launch test: verify the app actually starts without crashing.
      #
      # This used to be x64-only because a cross-built arm64 binary cannot run
      # on an x64 runner. Now that the arm64 leg builds natively it can, and it
      # is the check that would have caught #112 outright — the app died at
      # startup on a missing native module while the .deb built perfectly.
      - name: Smoke test - verify app launches
        run: |
          APP_NAME=$(node -p "require('./package.json').name")
          echo "Detected app name: $APP_NAME"
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum "out/${APP_NAME}-linux-${{ matrix.arch }}/${APP_NAME}" --no-sandbox &
          APP_PID=$!
          sleep 5
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ App launched successfully (PID $APP_PID)"
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          else
            echo "✗ App crashed or failed to start"
            wait $APP_PID 2>/dev/null
            EXIT_CODE=$?
            echo "Exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Verify build artifacts exist
        shell: bash
        run: |
          echo "=== Linux ${{ matrix.arch }} artifacts ==="
          find out/make -type f 2>/dev/null | head -20 || echo "No artifacts in out/make"
          ls out/make/deb/${{ matrix.arch }}/*.deb 2>/dev/null && echo "✓ DEB found" || echo "No DEB"
