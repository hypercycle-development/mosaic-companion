name: Release

on:
  push:
    branches:
      - main

jobs:
  # Check if this commit should trigger a release
  check-deploy:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version_type: ${{ steps.check.outputs.version_type }}
    steps:
      - name: Check for deploy trigger
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if [[ "$COMMIT_MSG" == *"[DEPLOY]"* ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            
            # Determine version type
            if [[ "$COMMIT_MSG" == *"[MAJOR]"* ]]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
            elif [[ "$COMMIT_MSG" == *"[MINOR]"* ]]; then
              echo "version_type=minor" >> $GITHUB_OUTPUT
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  # Bump version and commit
  bump-version:
    needs: check-deploy
    if: needs.check-deploy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Bump version (npm version doesn't require npm install)
          npm version ${{ needs.check-deploy.outputs.version_type }} --no-git-tag-version

          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Commit and push
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

      - name: Create release tag
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          VERSION_TYPE="${{ needs.check-deploy.outputs.version_type }}"
          BUCKET_URL="https://mosaic-release.s3.us-east-2.amazonaws.com/releases"

          # Create tag message with download links
          TAG_MESSAGE="Release v${VERSION} (${VERSION_TYPE})

          Download links:
          - Linux x64 (deb): ${BUCKET_URL}/linux/x64/mosaic-companion_${VERSION}_amd64.deb
          - Linux arm64 (deb): ${BUCKET_URL}/linux/arm64/mosaic-companion_${VERSION}_arm64.deb
          - Windows x64: ${BUCKET_URL}/win32/x64/MosaicCompanion-${VERSION}-Setup.exe
          - Windows arm64: ${BUCKET_URL}/win32/arm64/MosaicCompanion-${VERSION}-Setup.exe
          - macOS x64: ${BUCKET_URL}/darwin/x64/Mosaic Companion-${VERSION}-x64.dmg
          - macOS arm64: ${BUCKET_URL}/darwin/arm64/Mosaic Companion-${VERSION}-arm64.dmg"

          git tag -a "v${VERSION}" -m "$TAG_MESSAGE"
          git push origin "v${VERSION}"

  # Build for all platforms using Electron Forge
  build:
    needs: [check-deploy, bump-version]
    if: needs.check-deploy.outputs.should_deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # Linux arm64 (cross-compile)
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # macOS x64
          - os: macos-latest
            platform: darwin
            arch: x64
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Windows x64
          - os: windows-latest
            platform: win32
            arch: x64
          # Windows arm64 (cross-compile)
          - os: windows-latest
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main # Get the version-bumped code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Linux-specific: Install build dependencies for deb maker
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Make and publish using Electron Forge with specific arch
      - name: Make and Publish (${{ matrix.platform }}/${{ matrix.arch }})
        run: npm run deploy -- --arch ${{ matrix.arch }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Upload static installation page and latest.json (Linux x64 only - just need to do it once)
      - name: Upload static page and version info
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          echo "Updating static installation page and version info for version ${VERSION}..."

          mkdir -p tmp_static

          # Update index.html
          sed "s/{{VERSION}}/${VERSION}/g" static/install-page/index.template.html > tmp_static/index.html

          # Generate latest.json from template
          sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{RELEASE_DATE}}/${RELEASE_DATE}/g" static/install-page/latest.template.json > tmp_static/latest.json

          aws s3 cp tmp_static/index.html s3://mosaic-release/index.html --content-type "text/html"
          aws s3 cp static/install-page/style.css s3://mosaic-release/style.css --content-type "text/css"
          aws s3 cp tmp_static/latest.json s3://mosaic-release/latest.json --content-type "application/json"

          rm -rf tmp_static
          echo "✓ Static page and latest.json uploaded"
